name: Deploy MAGTOPIA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magictown-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ECS_SSH_KEY" > "$HOME/.ssh/magictown_deploy"
          chmod 600 "$HOME/.ssh/magictown_deploy"
          ssh-keyscan -p "${ECS_PORT:-22}" -H "$ECS_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy exact commit
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
          GIT_SHA: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/magictown_deploy" \
            -p "${ECS_PORT:-22}" \
            -o BatchMode=yes \
            "${ECS_USER:-root}@${ECS_HOST}" \
            "bash -se -- '$GIT_SHA'" <<'REMOTE_SCRIPT'
          /opt/magictown/deploy.sh "$1"

          # Keep the live ECS runtime at the supported maximum credential TTL.
          sed -i \
            's/^MAGICTOWN_CREDENTIAL_TTL_DAYS=.*/MAGICTOWN_CREDENTIAL_TTL_DAYS=90/' \
            /etc/magictown/magictown.env
          grep -qx 'MAGICTOWN_CREDENTIAL_TTL_DAYS=90' /etc/magictown/magictown.env
          systemctl restart magictown.service

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4184/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "MAGTOPIA health check failed after applying the production runtime configuration" >&2
          exit 1
          REMOTE_SCRIPT
